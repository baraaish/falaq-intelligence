---
# cPanel pulls the repository into /home/falaqai/repositories/falaq-website.
# Deployment then copies only the static, public allowlist below. Backend code,
# source generators, secrets and Git metadata never enter public_html.
deployment:
  tasks:
    - export DEPLOYPATH=/home/falaqai/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp index.html robots.txt sitemap.xml $DEPLOYPATH
    - /bin/cp -R about ar assets contact en how-we-work industries measuring-results privacy responsible-ai service-standards services sla technology terms thank-you trust $DEPLOYPATH
