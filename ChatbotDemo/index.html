<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generative UI - Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar-container">
                <!-- Avatar SVG (Transparent Background, No Black Borders) -->
                <svg class="bot-avatar" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00f2fe" />
                            <stop offset="100%" stop-color="#4facfe" />
                        </linearGradient>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="5" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#avatarGradient)" stroke-width="4" stroke-dasharray="10 5" class="spin-slow" />
                    <circle cx="50" cy="50" r="35" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
                    <path d="M40,45 A10,10 0 0,1 60,45" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
                    <circle cx="35" cy="40" r="4" fill="#ffffff" filter="url(#glow)"/>
                    <circle cx="65" cy="40" r="4" fill="#ffffff" filter="url(#glow)"/>
                </svg>
                <div class="online-indicator"></div>
            </div>
            <div class="header-info">
                <h2>المساعد الذكي (AI)</h2>
                <p>مُتصل الآن - يدعم Generative UI</p>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-messages" id="chatMessages">
            <!-- Initial Welcome Message -->
            <div class="message bot-message">
                <div class="message-content">
                    مرحباً بك! أنا مساعدك الذكي. يمكنك أن تطلب مني تنفيذ أي مهمة وسأعرض لك كيف أفكر وأعمل خلف الكواليس خطوة بخطوة.
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا... (مثال: ابحث لي عن تذاكر طيران)" autocomplete="off">
            <button id="sendBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="currentColor"/>
                </svg>
            </button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
