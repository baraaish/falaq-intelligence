services:
  - type: web
    name: falaq-intelligence
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    autoDeployTrigger: commit
    healthCheckPath: /api/agent/status
    domains:
      - api.falaqai.com
    envVars:
      - key: GOOGLE_SHEETS_URL
        sync: false
      - key: GITHUB_MODELS_TOKEN
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://falaqai.com
