services:
  - type: web
    name: falaq-intelligence
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    autoDeployTrigger: commit
    healthCheckPath: /api/agent/status
    domains:
      - api.falaqai.com
    # Provider keys come from the environment group linked in the dashboard, so
    # they are deliberately not declared here.
    envVars:
      - key: GOOGLE_SHEETS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Falaq Bot <bot@mail.falaqai.com>
      - key: EMAIL_REPLY_TO
        value: hello@falaqai.com
      - key: LEAD_NOTIFICATION_EMAIL
        value: hello@falaqai.com
      - key: PUBLIC_SITE_URL
        value: https://falaqai.com
